name: PR overlap

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-overlap

jobs:
  overlap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          out=$RUNNER_TEMP/overlap
          python3 tools/pr_overlap.py --base "${{ github.event.repository.default_branch }}" --out "$out"
          marker='<!-- pr-overlap -->'
          # No open pull requests means the tool writes no reports; without
          # nullglob the loop still runs once with a literal '*.md' and the
          # comments lookup 404s on a pull request that does not exist.
          shopt -s nullglob
          files=("$out"/*.md)
          [ ${#files[@]} -gt 0 ] || { echo "no open pull requests to compare"; exit 0; }
          for file in "${files[@]}"; do
            pr=$(basename "$file" .md)
            comment=$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | [.id, .body] | @json" | head -n1)
            id=$(jq -r '.[0] // empty' <<< "${comment:-null}")
            if [ -s "$file" ]; then
              [ "$(jq -r '.[1]' <<< "${comment:-null}")" = "$(cat "$file")" ] && continue
              if [ -n "$id" ]; then
                gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@"$file" > /dev/null
              else
                gh pr comment "$pr" --body-file "$file"
              fi
            elif [ -n "$id" ]; then
              gh api -X DELETE "repos/$GH_REPO/issues/comments/$id"
            fi
          done
